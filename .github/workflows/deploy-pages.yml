# Builds the Astro book (website/) and deploys it together with the static
# portal pages to GitHub Pages. The book is served under /prirucnik/.
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Build book
        run: npm run build
        working-directory: website
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/assets
          cp -r JuniorskeIzbornePripreme _site/JuniorskeIzbornePripreme
          cp -r jhio _site/jhio
          cp -r prijevodi _site/prijevodi
          cp -r website/dist _site/prirucnik
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
